<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#DC2626" />
  <title>Page not found — Doorline</title>
  <meta name="robots" content="noindex" />
  <!-- Served with a real HTTP 404 by the server for any unknown top-level path (see
       server/src/webRoutes.js). No canonical, no OG — it is a status, not a page. -->
  <style>
    :root{color-scheme:light}
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#f9fafb;color:#111827;font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem}
    main{max-width:28rem;width:100%;background:#fff;border-radius:.5rem;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:2rem;text-align:center}
    .code{font-size:.875rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#dc2626}
    h1{margin-top:.5rem;font-size:1.5rem;font-weight:600}
    p{margin-top:.75rem;font-size:.875rem;color:#4b5563}
    .actions{margin-top:1.5rem;display:flex;gap:.75rem;justify-content:center}
    a.primary{background:#dc2626;color:#fff;border-radius:.375rem;padding:.5rem 1rem;font-size:.875rem;font-weight:500;text-decoration:none}
    a.secondary{border:1px solid #d1d5db;color:#374151;border-radius:.375rem;padding:.5rem 1rem;font-size:.875rem;font-weight:500;text-decoration:none}
  </style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>Page not found</h1>
  <p>This page doesn&rsquo;t exist, or it moved. If you followed a link from an email, it may have expired.</p>
  <div class="actions">
    <a class="primary" href="/">Go to doorline.app</a>
    <a class="secondary" href="/login">Sign in</a>
  </div>
</main>
</body>
</html>
