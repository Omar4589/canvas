<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Never send a Referer header off-site. Critical so the one-time token in a
         /reset-password/:token URL can't leak via the Referer of any outbound request; harmless
         for the public marketing routes (no SEO cost, unlike robots). -->
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#DC2626" />

    <title>Doorline — Door-to-door canvassing software for campaigns and causes</title>
    <meta
      name="description"
      content="Doorline takes a voter file to walkable turf, puts a GPS-stamped, offline-first app in every canvasser's hand, and lands every door and every result on one live map. Cut turf, knock the doors, and know exactly what happened — for political campaigns and every cause that knocks doors."
    />
    <link rel="canonical" href="https://doorline.app/" />

    <!-- Open Graph (absolute URLs — social scrapers don't run JS) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Doorline" />
    <meta property="og:title" content="Doorline — Cut the turf. Walk the doors. Know exactly what happened." />
    <meta
      property="og:description"
      content="Canvassing software for campaigns and causes: turf cutting, a GPS-stamped offline-first field app, live oversight, and frozen reports you share from one link."
    />
    <meta property="og:url" content="https://doorline.app/" />
    <meta property="og:image" content="https://doorline.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Doorline — Door-to-door canvassing software" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Doorline — Door-to-door canvassing software for campaigns and causes" />
    <meta
      name="twitter:description"
      content="Turf cutting, a GPS-stamped offline-first field app, live oversight, and frozen reports you share from one link."
    />
    <meta name="twitter:image" content="https://doorline.app/og-image.png" />
    <meta name="twitter:image:alt" content="Doorline — Door-to-door canvassing software" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Doorline",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web, iOS, Android",
        "url": "https://doorline.app/",
        "description": "Door-to-door canvassing software for campaigns and causes: turf cutting, a GPS-stamped offline-first field app, live oversight, and frozen reports shared from one link.",
        "audience": {
          "@type": "Audience",
          "audienceType": "Political campaigns, advocacy and issue organizations, and field teams"
        }
      }
    </script>

    <!-- Apply the saved/system theme before first paint to avoid a flash of light. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var dark = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
