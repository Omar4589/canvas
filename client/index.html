<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#DC2626" />

    <title>Doorline — Door-to-door canvassing platform for political consultants</title>
    <meta
      name="description"
      content="Doorline runs your whole door program: import the voter file, cut walkable turf, knock with a GPS-stamped offline-first field app, and publish client reports with billing-grade knock counts — all from one platform built for political consulting firms and campaigns."
    />
    <link rel="canonical" href="https://doorline.app/" />

    <!-- Open Graph (absolute URLs — social scrapers don't run JS) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Doorline" />
    <meta property="og:title" content="Doorline — Run every door program you sell. Prove every knock you bill." />
    <meta
      property="og:description"
      content="The canvassing platform for political consulting firms: turf cutting, a GPS-stamped offline-first field app, live oversight, and frozen client reports your clients open from a link."
    />
    <meta property="og:url" content="https://doorline.app/" />
    <meta property="og:image" content="https://doorline.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Doorline — Door-to-door canvassing software" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Doorline — Door-to-door canvassing platform for political consultants" />
    <meta
      name="twitter:description"
      content="Turf cutting, a GPS-stamped offline-first field app, live oversight, and client reports with billing-grade knock counts."
    />
    <meta name="twitter:image" content="https://doorline.app/og-image.png" />
    <meta name="twitter:image:alt" content="Doorline — Door-to-door canvassing software" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Doorline",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web, iOS, Android",
        "url": "https://doorline.app/",
        "description": "Door-to-door canvassing platform for political consulting firms and campaigns: turf cutting, a GPS-stamped offline-first field app, live oversight, and frozen client reports with billing-grade knock counts.",
        "audience": {
          "@type": "Audience",
          "audienceType": "Political consulting firms, campaigns, and field organizers"
        }
      }
    </script>

    <!-- Apply the saved/system theme before first paint to avoid a flash of light. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var dark = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
