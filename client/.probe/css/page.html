<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="./out.css"><style>html,body{margin:0}</style></head>
<body class="bg-surface text-fg">
<div id="vp" style="width:432px;overflow:hidden"><div class="flex" style="height:600px">
  <aside class="hidden md:flex flex-col w-60 px-4"></aside>
  <div class="flex min-w-0 flex-1 flex-col">
    <div class="md:hidden flex items-center gap-2 px-4 py-2">topbar</div>
    <main id="main" class="flex-1 overflow-auto p-6 pb-20 md:pb-6">
      <div>
        <div class="mb-4 space-y-2">
          <div class="animate-pulse rounded bg-sunken h-8 w-64"></div>
          <div id="sub" class="animate-pulse rounded bg-sunken h-4 w-96 opacity-60"></div>
        </div>
        <div class="animate-pulse rounded bg-sunken h-64 w-full opacity-60"></div>
      </div>
    </main>
  </div>
</div></div></div>
<pre id="out"></pre>
<script>
 const m=document.getElementById('main'), s=document.getElementById('sub');
 document.getElementById('out').textContent = JSON.stringify({
   viewport: window.innerWidth,
   mainClientWidth: m.clientWidth,
   mainScrollWidth: m.scrollWidth,
   overflowsHorizontally: m.scrollWidth > m.clientWidth,
   subtitleBarWidth: s.getBoundingClientRect().width,
   docScrollWidth: document.documentElement.scrollWidth,
 });
</script></body></html>
